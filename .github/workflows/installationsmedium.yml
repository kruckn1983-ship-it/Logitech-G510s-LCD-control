name: Installationsmedium

# Bei jeder Änderung wird das komplette Installationsmedium neu gebaut
# (.run, .tar.gz, .iso) und unter "Releases" -> "Neueste Version" bereitgestellt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Werkzeuge installieren
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Syntax der Installationsskripte prüfen
        run: |
          bash -n install.sh
          bash -n scripts/install-deps.sh
          bash -n scripts/install-driver.sh
          bash -n scripts/build.sh scripts/rebuild.sh
          python3 -m compileall -q src scripts tests

      - name: Treiber und Programm testweise bauen
        run: |
          sudo apt-get install -y python3-pyqt5 python3-pil python3-evdev libfreetype-dev libusb-dev build-essential pkg-config autoconf automake libtool patch bzip2
          G510_FORCE_DRIVER=1 scripts/install-driver.sh
          bash scripts/build.sh --project-dir /tmp/g510 --output-dir /tmp/g510-build

      - name: Regressionstests ohne Hardware
        run: PYTHONDONTWRITEBYTECODE=1 QT_QPA_PLATFORM=offscreen /usr/bin/python3 -m unittest discover -s tests -q

      - name: Installationsmedium bauen
        run: G510_VERSION="$(date +%Y.%m.%d)-${GITHUB_SHA::7}" scripts/build-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installationsmedium
          path: dist/*

      - name: Release "Neueste Version" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste-version --yes --cleanup-tag || true
          gh release create neueste-version dist/* \
            --title "Neueste Version (automatisch gebaut)" \
            --notes "Automatisch erzeugtes Installationsmedium. Anleitung: INSTALLATION.md. Installation: 'bash g510s-steuerung-*.run'."
